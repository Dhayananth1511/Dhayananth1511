name: Generate GitHub Trophies

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-trophies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Trophy SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path
          from html import escape

          USERNAME = "Dhayananth1511"
          TOKEN = os.environ["GITHUB_TOKEN"]

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {TOKEN}",
              "User-Agent": "github-trophy-generator"
          }

          def github_api(url):
              request = urllib.request.Request(
                  url,
                  headers=headers
              )

              with urllib.request.urlopen(request) as response:
                  return json.loads(response.read().decode())

          print("Fetching GitHub profile...")

          user = github_api(
              f"https://api.github.com/users/{USERNAME}"
          )

          print("Fetching repositories...")

          repositories = github_api(
              f"https://api.github.com/users/{USERNAME}/repos?per_page=100"
          )

          repos = len(repositories)

          stars = sum(
              repo.get("stargazers_count", 0)
              for repo in repositories
          )

          forks = sum(
              repo.get("forks_count", 0)
              for repo in repositories
          )

          followers = user.get("followers", 0)

          languages = set()

          for repo in repositories:
              if repo.get("language"):
                  languages.add(repo["language"])

          language_count = len(languages)

          print(f"Repositories: {repos}")
          print(f"Stars: {stars}")
          print(f"Forks: {forks}")
          print(f"Followers: {followers}")
          print(f"Languages: {language_count}")

          # ---------------------------------------
          # Achievements
          # ---------------------------------------

          trophies = []

          def trophy(icon, title, description):
              trophies.append(
                  (icon, title, description)
              )

          if repos >= 1:
              trophy(
                  "📦",
                  "First Repository",
                  "Created your first repository"
              )

          if repos >= 5:
              trophy(
                  "🚀",
                  "Project Builder",
                  "5+ public repositories"
              )

          if repos >= 10:
              trophy(
                  "🏗️",
                  "Prolific Builder",
                  "10+ public repositories"
              )

          if stars >= 1:
              trophy(
                  "⭐",
                  "First Star",
                  "Received your first star"
              )

          if stars >= 10:
              trophy(
                  "🌟",
                  "Rising Star",
                  "Received 10+ stars"
              )

          if stars >= 50:
              trophy(
                  "💫",
                  "Star Collector",
                  "Received 50+ stars"
              )

          if forks >= 1:
              trophy(
                  "🍴",
                  "First Fork",
                  "A repository was forked"
              )

          if followers >= 10:
              trophy(
                  "👥",
                  "Growing Network",
                  "10+ GitHub followers"
              )

          if followers >= 50:
              trophy(
                  "🌐",
                  "Community Builder",
                  "50+ GitHub followers"
              )

          if language_count >= 3:
              trophy(
                  "💻",
                  "Polyglot Developer",
                  "Used 3+ programming languages"
              )

          if language_count >= 5:
              trophy(
                  "🧠",
                  "Tech Explorer",
                  "Used 5+ programming languages"
              )

          trophy(
              "🤖",
              "AI Developer",
              "Building AI and ML projects"
          )

          trophy(
              "🐳",
              "DevOps Explorer",
              "Learning cloud and DevOps"
          )

          # Keep maximum 12 trophies
          trophies = trophies[:12]

          # ---------------------------------------
          # SVG Configuration
          # ---------------------------------------

          columns = 4
          card_width = 245
          card_height = 155

          rows = max(
              1,
              (len(trophies) + columns - 1) // columns
          )

          width = 1050
          height = 110 + rows * 180

          svg = []

          svg.append(
              f'<svg xmlns="http://www.w3.org/2000/svg" '
              f'width="{width}" height="{height}" '
              f'viewBox="0 0 {width} {height}">'
          )

          # Background
          svg.append(
              '<rect width="100%" height="100%" '
              'rx="20" fill="#0d1117"/>'
          )

          # Title
          svg.append(
              '<text x="525" y="42" '
              'text-anchor="middle" '
              'font-family="Arial, sans-serif" '
              'font-size="28" '
              'font-weight="bold" '
              'fill="#ffffff">'
              '🏆 GitHub Achievements'
              '</text>'
          )

          # Username
          svg.append(
              '<text x="525" y="68" '
              'text-anchor="middle" '
              'font-family="Arial, sans-serif" '
              'font-size="14" '
              'fill="#8b949e">'
              f'{USERNAME}'
              '</text>'
          )

          # Trophy cards
          for i, (icon, title, description) in enumerate(trophies):

              col = i % columns
              row = i // columns

              x = 25 + col * 255
              y = 90 + row * 180

              # Card
              svg.append(
                  f'<rect x="{x}" y="{y}" '
                  f'width="{card_width}" '
                  f'height="{card_height}" '
                  'rx="16" '
                  'fill="#161b22" '
                  'stroke="#30363d"/>'
              )

              # Icon
              svg.append(
                  f'<text x="{x + 122}" '
                  f'y="{y + 45}" '
                  'text-anchor="middle" '
                  'font-size="32">'
                  f'{escape(icon)}'
                  '</text>'
              )

              # Title
              svg.append(
                  f'<text x="{x + 122}" '
                  f'y="{y + 80}" '
                  'text-anchor="middle" '
                  'font-family="Arial, sans-serif" '
                  'font-size="16" '
                  'font-weight="bold" '
                  'fill="#ffffff">'
                  f'{escape(title)}'
                  '</text>'
              )

              # Description
              svg.append(
                  f'<text x="{x + 122}" '
                  f'y="{y + 108}" '
                  'text-anchor="middle" '
                  'font-family="Arial, sans-serif" '
                  'font-size="11" '
                  'fill="#8b949e">'
                  f'{escape(description)}'
                  '</text>'
              )

          svg.append("</svg>")

          # ---------------------------------------
          # Save SVG
          # ---------------------------------------

          Path("dist").mkdir(exist_ok=True)

          Path(
              "dist/github-trophies.svg"
          ).write_text(
              "\n".join(svg),
              encoding="utf-8"
          )

          print("Trophy SVG generated successfully.")
          print("File: dist/github-trophies.svg")

          PY

      - name: Publish Trophy SVG
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          keep_files: true
