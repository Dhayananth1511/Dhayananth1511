```yaml
name: Generate GitHub Trophies

on:
  schedule:
    - cron: "30 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  trophies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Trophy SVG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: Dhayananth1511
        run: |
          python3 <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error
          from pathlib import Path
          from html import escape

          USERNAME = os.environ["USERNAME"]
          TOKEN = os.environ["GH_TOKEN"]

          API = "https://api.github.com"

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {TOKEN}",
              "X-GitHub-Api-Version": "2026-03-10",
              "User-Agent": "github-trophy-generator"
          }

          def api(path):
              request = urllib.request.Request(
                  API + path,
                  headers=headers
              )

              try:
                  with urllib.request.urlopen(request) as response:
                      return json.loads(response.read().decode())
              except urllib.error.HTTPError as e:
                  print(f"GitHub API error: {e.code} {path}")
                  return None

          # ---------------------------------------------------------
          # Get user information
          # ---------------------------------------------------------

          user = api(f"/users/{USERNAME}")

          if not user:
              raise SystemExit("Unable to retrieve GitHub profile.")

          public_repos = user.get("public_repos", 0)
          followers = user.get("followers", 0)
          following = user.get("following", 0)

          # ---------------------------------------------------------
          # Get repositories
          # ---------------------------------------------------------

          repositories = []

          page = 1

          while page <= 5:
              data = api(
                  f"/users/{USERNAME}/repos"
                  f"?per_page=100&page={page}&sort=updated"
              )

              if not data:
                  break

              repositories.extend(data)

              if len(data) < 100:
                  break

              page += 1

          # ---------------------------------------------------------
          # Repository statistics
          # ---------------------------------------------------------

          stars = sum(
              repo.get("stargazers_count", 0)
              for repo in repositories
          )

          forks = sum(
              repo.get("forks_count", 0)
              for repo in repositories
          )

          languages = set()

          for repo in repositories:
              language = repo.get("language")

              if language:
                  languages.add(language)

          language_count = len(languages)

          # ---------------------------------------------------------
          # Determine achievements
          # ---------------------------------------------------------

          achievements = []

          def add(icon, title, description):
              achievements.append({
                  "icon": icon,
                  "title": title,
                  "description": description
              })

          # Repository achievements

          if public_repos >= 1:
              add(
                  "📦",
                  "First Repository",
                  "Created your first public repository"
              )

          if public_repos >= 5:
              add(
                  "🚀",
                  "Project Builder",
                  "5+ public repositories"
              )

          if public_repos >= 10:
              add(
                  "🏗️",
                  "Builder",
                  "10+ public repositories"
              )

          if public_repos >= 25:
              add(
                  "🏆",
                  "Open Source Builder",
                  "25+ public repositories"
              )

          # Stars

          if stars >= 1:
              add(
                  "⭐",
                  "First Star",
                  "Received your first repository star"
              )

          if stars >= 10:
              add(
                  "🌟",
                  "Rising Star",
                  "10+ repository stars"
              )

          if stars >= 50:
              add(
                  "💫",
                  "Star Collector",
                  "50+ repository stars"
              )

          if stars >= 100:
              add(
                  "✨",
                  "Star Power",
                  "100+ repository stars"
              )

          # Forks

          if forks >= 1:
              add(
                  "🍴",
                  "First Fork",
                  "Your project was forked"
              )

          if forks >= 10:
              add(
                  "🔱",
                  "Fork Magnet",
                  "10+ repository forks"
              )

          # Followers

          if followers >= 10:
              add(
                  "👥",
                  "Growing Network",
                  "10+ GitHub followers"
              )

          if followers >= 50:
              add(
                  "🌐",
                  "Community Builder",
                  "50+ GitHub followers"
              )

          if followers >= 100:
              add(
                  "👑",
                  "Community Leader",
                  "100+ GitHub followers"
              )

          # Languages

          if language_count >= 3:
              add(
                  "💻",
                  "Polyglot Developer",
                  "Projects using 3+ languages"
              )

          if language_count >= 5:
              add(
                  "🧠",
                  "Tech Explorer",
                  "Projects using 5+ languages"
              )

          # Special achievements

          repo_names = {
              repo.get("name", "").lower()
              for repo in repositories
          }

          if "dhayananth1511" in repo_names:
              add(
                  "🏠",
                  "Profile Creator",
                  "Created a GitHub profile repository"
              )

          if any(
              "ai" in repo.get("name", "").lower()
              or "ml" in repo.get("name", "").lower()
              for repo in repositories
          ):
              add(
                  "🤖",
                  "AI Developer",
                  "Built AI/ML related projects"
              )

          if any(
              "docker" in repo.get("name", "").lower()
              or "devops" in repo.get("name", "").lower()
              for repo in repositories
          ):
              add(
                  "🐳",
                  "DevOps Explorer",
                  "Worked with DevOps-related projects"
              )

          # ---------------------------------------------------------
          # Sort achievements
          # ---------------------------------------------------------

          achievements = achievements[:14]

          # ---------------------------------------------------------
          # SVG configuration
          # ---------------------------------------------------------

          width = 1050
          card_width = 235
          card_height = 150

          columns = 4
          rows = max(
              1,
              (len(achievements) + columns - 1) // columns
          )

          height = 115 + rows * 175

          svg = []

          svg.append(
              f'<svg xmlns="http://www.w3.org/2000/svg" '
              f'width="{width}" height="{height}" '
              f'viewBox="0 0 {width} {height}">'
          )

          # Background

          svg.append(
              '<rect width="100%" height="100%" '
              'rx="20" fill="#0d1117"/>'
          )

          # Title

          svg.append(
              '<text x="525" y="45" text-anchor="middle" '
              'font-family="Arial, Helvetica, sans-serif" '
              'font-size="28" font-weight="700" fill="#ffffff">'
              '🏆 GitHub Achievements'
              '</text>'
          )

          svg.append(
              '<text x="525" y="72" text-anchor="middle" '
              'font-family="Arial, Helvetica, sans-serif" '
              'font-size="14" fill="#8b949e">'
              f'{escape(USERNAME)} • {len(achievements)} achievements'
              '</text>'
          )

          # Trophy cards

          for index, achievement in enumerate(achievements):

              column = index % columns
              row = index // columns

              x = 25 + column * 255
              y = 95 + row * 175

              svg.append(
                  f'<rect x="{x}" y="{y}" '
                  f'width="{card_width}" height="{card_height}" '
                  'rx="16" fill="#161b22" '
                  'stroke="#30363d" stroke-width="1"/>'
              )

              svg.append(
                  f'<text x="{x + card_width / 2}" '
                  f'y="{y + 45}" text-anchor="middle" '
                  'font-size="32">'
                  f'{achievement["icon"]}'
                  '</text>'
              )

              svg.append(
                  f'<text x="{x + card_width / 2}" '
                  f'y="{y + 78}" text-anchor="middle" '
                  'font-family="Arial, Helvetica, sans-serif" '
                  'font-size="16" font-weight="700" '
                  'fill="#ffffff">'
                  f'{escape(achievement["title"])}'
                  '</text>'
              )

              description = achievement["description"]

              # Simple text wrapping

              if len(description) > 34:
                  words = description.split()
                  line1 = ""
                  line2 = ""

                  for word in words:
                      if len(line1 + " " + word) <= 34:
                          line1 += (" " if line1 else "") + word
                      else:
                          line2 += (" " if line2 else "") + word

                  svg.append(
                      f'<text x="{x + card_width / 2}" '
                      f'y="{y + 103}" text-anchor="middle" '
                      'font-family="Arial, Helvetica, sans-serif" '
                      'font-size="11" fill="#8b949e">'
                      f'{escape(line1)}'
                      '</text>'
                  )

                  svg.append(
                      f'<text x="{x + card_width / 2}" '
                      f'y="{y + 121}" text-anchor="middle" '
                      'font-family="Arial, Helvetica, sans-serif" '
                      'font-size="11" fill="#8b949e">'
                      f'{escape(line2)}'
                      '</text>'
                  )

              else:
                  svg.append(
                      f'<text x="{x + card_width / 2}" '
                      f'y="{y + 112}" text-anchor="middle" '
                      'font-family="Arial, Helvetica, sans-serif" '
                      'font-size="11" fill="#8b949e">'
                      f'{escape(description)}'
                      '</text>'
                  )

          svg.append("</svg>")

          output = Path("dist")
          output.mkdir(exist_ok=True)

          file = output / "github-trophies.svg"

          file.write_text(
              "\n".join(svg),
              encoding="utf-8"
          )

          print(f"Generated {file}")
          print(f"Repositories: {public_repos}")
          print(f"Stars: {stars}")
          print(f"Forks: {forks}")
          print(f"Followers: {followers}")
          print(f"Languages: {language_count}")
          print(f"Achievements: {len(achievements)}")

          PY

      - name: Publish trophy SVG
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          force_orphan: false
```
