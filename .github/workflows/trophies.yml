name: Generate GitHub Trophies

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-trophies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Generate Trophy SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path
          from html import escape

          USERNAME = "Dhayananth1511"
          TOKEN = os.environ["GITHUB_TOKEN"]

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {TOKEN}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "github-trophy-generator"
          }

          def github_api(url):
              request = urllib.request.Request(
                  url,
                  headers=headers
              )

              with urllib.request.urlopen(request) as response:
                  return json.loads(response.read().decode())

          print("Fetching GitHub profile...")

          user = github_api(
              f"https://api.github.com/users/{USERNAME}"
          )

          print("Fetching repositories...")

          repositories = github_api(
              f"https://api.github.com/users/{USERNAME}/repos?per_page=100"
          )

          repo_count = len(repositories)

          stars = sum(
              repo.get("stargazers_count", 0)
              for repo in repositories
          )

          forks = sum(
              repo.get("forks_count", 0)
              for repo in repositories
          )

          followers = user.get("followers", 0)

          languages = set()

          for repo in repositories:
              if repo.get("language"):
                  languages.add(repo["language"])

          language_count = len(languages)

          print("Repositories:", repo_count)
          print("Stars:", stars)
          print("Forks:", forks)
          print("Followers:", followers)
          print("Languages:", language_count)

          # -------------------------------
          # Achievements
          # -------------------------------

          trophies = []

          def add(icon, title, description):
              trophies.append(
                  (icon, title, description)
              )

          if repo_count >= 1:
              add(
                  "📦",
                  "First Repository",
                  "Created your first repository"
              )

          if repo_count >= 5:
              add(
                  "🚀",
                  "Project Builder",
                  "5+ public repositories"
              )

          if repo_count >= 10:
              add(
                  "🏗️",
                  "Prolific Builder",
                  "10+ public repositories"
              )

          if stars >= 1:
              add(
                  "⭐",
                  "First Star",
                  "Received your first star"
              )

          if stars >= 10:
              add(
                  "🌟",
                  "Rising Star",
                  "Received 10+ stars"
              )

          if stars >= 50:
              add(
                  "💫",
                  "Star Collector",
                  "Received 50+ stars"
              )

          if forks >= 1:
              add(
                  "🍴",
                  "First Fork",
                  "A repository was forked"
              )

          if followers >= 10:
              add(
                  "👥",
                  "Growing Network",
                  "10+ GitHub followers"
              )

          if followers >= 50:
              add(
                  "🌐",
                  "Community Builder",
                  "50+ GitHub followers"
              )

          if language_count >= 3:
              add(
                  "💻",
                  "Polyglot Developer",
                  "Used 3+ programming languages"
              )

          if language_count >= 5:
              add(
                  "🧠",
                  "Tech Explorer",
                  "Used 5+ programming languages"
              )

          add(
              "🤖",
              "AI Developer",
              "Building AI and ML projects"
          )

          add(
              "🐳",
              "DevOps Explorer",
              "Working with cloud and DevOps"
          )

          trophies = trophies[:12]

          # -------------------------------
          # SVG
          # -------------------------------

          columns = 4
          card_width = 245
          card_height = 155

          rows = max(
              1,
              (len(trophies) + columns - 1) // columns
          )

          width = 1050
          height = 110 + rows * 180

          svg = []

          svg.append(
              f'<svg xmlns="http://www.w3.org/2000/svg" '
              f'width="{width}" height="{height}" '
              f'viewBox="0 0 {width} {height}">'
          )

          svg.append(
              '<rect width="100%" height="100%" '
              'rx="20" fill="#0d1117"/>'
          )

          svg.append(
              '<text x="525" y="42" '
              'text-anchor="middle" '
              'font-family="Arial, sans-serif" '
              'font-size="28" '
              'font-weight="bold" '
              'fill="#ffffff">'
              '🏆 GitHub Achievements'
              '</text>'
          )

          svg.append(
              '<text x="525" y="68" '
              'text-anchor="middle" '
              'font-family="Arial, sans-serif" '
              'font-size="14" '
              'fill="#8b949e">'
              f'{USERNAME}'
              '</text>'
          )

          for i, (icon, title, description) in enumerate(trophies):

              col = i % columns
              row = i // columns

              x = 25 + col * 255
              y = 90 + row * 180

              svg.append(
                  f'<rect x="{x}" y="{y}" '
                  f'width="{card_width}" '
                  f'height="{card_height}" '
                  'rx="16" '
                  'fill="#161b22" '
                  'stroke="#30363d"/>'
              )

              svg.append(
                  f'<text x="{x + 122}" '
                  f'y="{y + 45}" '
                  'text-anchor="middle" '
                  'font-size="32">'
                  f'{escape(icon)}'
                  '</text>'
              )

              svg.append(
                  f'<text x="{x + 122}" '
                  f'y="{y + 80}" '
                  'text-anchor="middle" '
                  'font-family="Arial, sans-serif" '
                  'font-size="16" '
                  'font-weight="bold" '
                  'fill="#ffffff">'
                  f'{escape(title)}'
                  '</text>'
              )

              svg.append(
                  f'<text x="{x + 122}" '
                  f'y="{y + 108}" '
                  'text-anchor="middle" '
                  'font-family="Arial, sans-serif" '
                  'font-size="11" '
                  'fill="#8b949e">'
                  f'{escape(description)}'
                  '</text>'
              )

          svg.append("</svg>")

          Path("github-trophies.svg").write_text(
              "\n".join(svg),
              encoding="utf-8"
          )

          print("SUCCESS: github-trophies.svg created")

          PY

      # -------------------------------------------------------
      # IMPORTANT:
      # Put the generated file into the EXISTING output branch
      # -------------------------------------------------------

      - name: Publish Trophy to output branch
        run: |
          echo "Preparing output branch..."

          cp github-trophies.svg /tmp/github-trophies.svg

          git fetch origin output

          git checkout output

          cp /tmp/github-trophies.svg github-trophies.svg

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add github-trophies.svg

          if git diff --cached --quiet; then
            echo "No changes to trophy SVG."
          else
            git commit -m "Update GitHub trophies"
            git push origin output
          fi

          echo "=================================="
          echo "Trophy file published successfully"
          echo "=================================="

      - name: Verify Trophy File
        run: |
          echo "Checking generated file..."

          git ls-tree -r --name-only HEAD | grep github-trophies.svg

          echo ""
          echo "Trophy SVG exists in output branch."
