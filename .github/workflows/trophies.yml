name: Generate GitHub Trophies

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-trophies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Trophy SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request
          import base64
          from pathlib import Path
          from html import escape

          USERNAME = "Dhayananth1511"
          TOKEN = os.environ["GITHUB_TOKEN"]

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {TOKEN}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "github-trophy-generator"
          }

          def github_api(url):
              request = urllib.request.Request(
                  url,
                  headers=headers
              )

              with urllib.request.urlopen(request) as response:
                  return json.loads(response.read().decode())

          print("Getting GitHub profile...")

          user = github_api(
              f"https://api.github.com/users/{USERNAME}"
          )

          print("Getting repositories...")

          repositories = github_api(
              f"https://api.github.com/users/{USERNAME}/repos?per_page=100"
          )

          repo_count = len(repositories)

          stars = sum(
              repo.get("stargazers_count", 0)
              for repo in repositories
          )

          forks = sum(
              repo.get("forks_count", 0)
              for repo in repositories
          )

          followers = user.get("followers", 0)

          languages = set()

          for repo in repositories:
              language = repo.get("language")

              if language:
                  languages.add(language)

          language_count = len(languages)

          print(f"Repositories: {repo_count}")
          print(f"Stars: {stars}")
          print(f"Forks: {forks}")
          print(f"Followers: {followers}")
          print(f"Languages: {language_count}")

          # -----------------------------------------
          # Trophy definitions
          # -----------------------------------------

          trophies = []

          def add(icon, title, description):
              trophies.append(
                  (icon, title, description)
              )

          if repo_count >= 1:
              add(
                  "📦",
                  "First Repository",
                  "Created your first repository"
              )

          if repo_count >= 5:
              add(
                  "🚀",
                  "Project Builder",
                  "5+ public repositories"
              )

          if repo_count >= 10:
              add(
                  "🏗️",
                  "Prolific Builder",
                  "10+ public repositories"
              )

          if stars >= 1:
              add(
                  "⭐",
                  "First Star",
                  "Received your first star"
              )

          if stars >= 10:
              add(
                  "🌟",
                  "Rising Star",
                  "Received 10+ stars"
              )

          if stars >= 50:
              add(
                  "💫",
                  "Star Collector",
                  "Received 50+ stars"
              )

          if forks >= 1:
              add(
                  "🍴",
                  "First Fork",
                  "Your project was forked"
              )

          if followers >= 10:
              add(
                  "👥",
                  "Growing Network",
                  "10+ GitHub followers"
              )

          if followers >= 50:
              add(
                  "🌐",
                  "Community Builder",
                  "50+ GitHub followers"
              )

          if language_count >= 3:
              add(
                  "💻",
                  "Polyglot Developer",
                  "Used 3+ programming languages"
              )

          if language_count >= 5:
              add(
                  "🧠",
                  "Tech Explorer",
                  "Used 5+ programming languages"
              )

          add(
              "🤖",
              "AI Developer",
              "Building AI and ML projects"
          )

          add(
              "🐳",
              "DevOps Explorer",
              "Working with cloud and DevOps"
          )

          trophies = trophies[:12]

          # -----------------------------------------
          # Generate SVG
          # -----------------------------------------

          columns = 4
          card_width = 245
          card_height = 155

          rows = max(
              1,
              (len(trophies) + columns - 1) // columns
          )

          width = 1050
          height = 110 + rows * 180

          svg = []

          svg.append(
              f'<svg xmlns="http://www.w3.org/2000/svg" '
              f'width="{width}" height="{height}" '
              f'viewBox="0 0 {width} {height}">'
          )

          svg.append(
              '<rect width="100%" height="100%" '
              'rx="20" fill="#0d1117"/>'
          )

          svg.append(
              '<text x="525" y="42" '
              'text-anchor="middle" '
              'font-family="Arial, sans-serif" '
              'font-size="28" '
              'font-weight="bold" '
              'fill="#ffffff">'
              'GitHub Achievements'
              '</text>'
          )

          svg.append(
              '<text x="525" y="68" '
              'text-anchor="middle" '
              'font-family="Arial, sans-serif" '
              'font-size="14" '
              'fill="#8b949e">'
              f'{USERNAME}'
              '</text>'
          )

          for i, (icon, title, description) in enumerate(trophies):

              col = i % columns
              row = i // columns

              x = 25 + col * 255
              y = 90 + row * 180

              svg.append(
                  f'<rect x="{x}" y="{y}" '
                  f'width="{card_width}" '
                  f'height="{card_height}" '
                  'rx="16" '
                  'fill="#161b22" '
                  'stroke="#30363d"/>'
              )

              svg.append(
                  f'<text x="{x + 122}" '
                  f'y="{y + 45}" '
                  'text-anchor="middle" '
                  'font-size="32">'
                  f'{escape(icon)}'
                  '</text>'
              )

              svg.append(
                  f'<text x="{x + 122}" '
                  f'y="{y + 80}" '
                  'text-anchor="middle" '
                  'font-family="Arial, sans-serif" '
                  'font-size="16" '
                  'font-weight="bold" '
                  'fill="#ffffff">'
                  f'{escape(title)}'
                  '</text>'
              )

              svg.append(
                  f'<text x="{x + 122}" '
                  f'y="{y + 108}" '
                  'text-anchor="middle" '
                  'font-family="Arial, sans-serif" '
                  'font-size="11" '
                  'fill="#8b949e">'
                  f'{escape(description)}'
                  '</text>'
              )

          svg.append("</svg>")

          Path("github-trophies.svg").write_text(
              "\n".join(svg),
              encoding="utf-8"
          )

          print("github-trophies.svg generated successfully.")

          PY

      - name: Upload Trophy SVG to output branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Uploading github-trophies.svg..."

          CONTENT=$(base64 -w 0 github-trophies.svg)

          URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/github-trophies.svg"

          RESPONSE=$(curl -s \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${URL}?ref=output")

          SHA=$(echo "$RESPONSE" | python3 -c "
          import sys,json
          try:
              data=json.load(sys.stdin)
              print(data.get('sha',''))
          except:
              print('')
          ")

          if [ -n "$SHA" ]; then
            echo "Existing trophy file found. Updating..."
            
            curl -L -s \
              -X PUT \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/github-trophies.svg" \
              -d "{
                \"message\": \"Update GitHub trophies\",
                \"content\": \"${CONTENT}\",
                \"sha\": \"${SHA}\",
                \"branch\": \"output\"
              }"

          else
            echo "Trophy file does not exist. Creating..."

            curl -L -s \
              -X PUT \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/github-trophies.svg" \
              -d "{
                \"message\": \"Add GitHub trophies\",
                \"content\": \"${CONTENT}\",
                \"branch\": \"output\"
              }"
          fi

          echo ""
          echo "Trophy upload completed."
